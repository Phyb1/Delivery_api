[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py"]
# --nomigrations builds the test database straight from the models (fast).
# CI separately checks that migrations are up to date: `makemigrations --check`.
addopts = "--nomigrations -ra --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/tests/*", "*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
